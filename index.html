<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Suika Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  @font-face {
    font-family: 'Digitalt';
    src: url('https://raw.githubusercontent.com/advme/suika-game/main/Digitalt.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background: #0a1628;
    font-family: 'Digitalt', -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: var(--app-height, 100dvh);
    padding-top: env(safe-area-inset-top);
    padding-bottom: 0;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  /* ===== MAIN WRAPPER ===== */
  #game-wrapper {
    width: 100%;
    max-width: 430px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ===== SCORE BAR (top, centered) ===== */
  #score-bar {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
  }

  #score-chip {
    background: linear-gradient(180deg, #5b9eef 0%, #3d7dd8 100%);
    border-radius: 22px;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 12px rgba(61, 125, 216, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.25);
  }

  #score-label {
    font-family: 'Digitalt', sans-serif;
    font-size: 18px;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.9;
  }

  #score-display {
    font-family: 'Digitalt', sans-serif;
    font-size: 28px;
    color: #fff;
    line-height: 1;
    transition: transform 0.15s ease;
    min-width: 30px;
    text-align: center;
  }

  #score-display.bump {
    transform: scale(1.2);
  }

  /* ===== GAME CANVAS ===== */
  #canvas-container {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }

  canvas#gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ===== BOTTOM BAR ===== */
  #bottom-bar {
    width: 100%;
    background: linear-gradient(180deg, #1a2d4d 0%, #0f1f38 100%);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-top: 2px solid #2a4570;
  }

  /* Next fruit area */
  #next-area {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.3);
    border-radius: 16px;
    padding: 6px 14px 6px 14px;
    border: 1.5px solid rgba(255,255,255,0.1);
  }

  #next-label {
    font-family: 'Digitalt', sans-serif;
    font-size: 16px;
    color: #fff;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  #next-fruit-preview {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #next-fruit-preview img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }

  /* Bottom buttons */
  #bottom-buttons {
    display: flex;
    gap: 12px;
  }

  .bottom-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }

  .bottom-btn:active {
    transform: scale(0.9);
  }

  .bottom-btn img {
    width: 48px;
    height: 48px;
  }

  /* Score popup animation */
  .score-popup {
    position: absolute;
    font-family: 'Digitalt', sans-serif;
    font-size: 22px;
    color: #fff;
    pointer-events: none;
    z-index: 5;
    animation: floatUp 0.8s ease-out forwards;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 12px rgba(76, 218, 254, 0.5);
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
  }

  /* ===== GAME OVER OVERLAY ===== */
  #game-over {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10, 22, 40, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #game-over.active {
    display: flex;
  }

  #game-over h2 {
    font-family: 'Digitalt', sans-serif;
    font-size: 38px;
    color: #4cdafe;
    margin-bottom: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(76, 218, 254, 0.5);
  }

  #game-over .final-label {
    font-family: 'Digitalt', sans-serif;
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  #game-over .final-score {
    font-family: 'Digitalt', sans-serif;
    font-size: 64px;
    color: #fff;
    margin-bottom: 32px;
    text-shadow: 0 0 20px rgba(76, 218, 254, 0.4);
  }

  #play-again-btn {
    font-family: 'Digitalt', sans-serif;
    background: linear-gradient(180deg, #5b9eef 0%, #3d7dd8 100%);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.25);
    padding: 16px 52px;
    border-radius: 20px;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 16px rgba(61, 125, 216, 0.5);
    transition: transform 0.1s;
  }

  #play-again-btn:active {
    transform: scale(0.96);
  }

  /* ===== FRUIT GUIDE OVERLAY ===== */
  #guide-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
  }

  #guide-overlay.active {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  #guide-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    -webkit-tap-highlight-color: transparent;
  }

  #guide-sheet {
    position: relative;
    background: linear-gradient(180deg, #1a2d4d 0%, #0f1f38 100%);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: calc(var(--app-height, 100dvh) * 0.65);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.3);
    border-top: 2px solid #2a4570;
  }

  #guide-handle {
    width: 36px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  #guide-sheet-title {
    font-family: 'Digitalt', sans-serif;
    font-size: 22px;
    color: #4cdafe;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .guide-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 8px;
    border-radius: 12px;
  }

  .guide-row:active {
    background: rgba(255,255,255,0.05);
  }

  .guide-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .guide-icon img {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }

  .guide-info {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .guide-name {
    font-family: 'Digitalt', sans-serif;
    font-size: 17px;
    color: #fff;
    letter-spacing: 1px;
  }

  .guide-pts {
    font-family: 'Digitalt', sans-serif;
    font-size: 15px;
    color: #4cdafe;
    background: rgba(76, 218, 254, 0.1);
    padding: 4px 12px;
    border-radius: 10px;
    border: 1px solid rgba(76, 218, 254, 0.2);
  }

  .guide-arrow {
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: 10px;
    padding: 2px 0;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- Score (floating centered at top) -->
  <div id="score-bar">
    <div id="score-chip">
      <span id="score-label">Score</span>
      <span id="score-display">0</span>
    </div>
  </div>

  <!-- Game Canvas -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <div id="game-over">
      <h2>Game Over</h2>
      <div class="final-label">Final Score</div>
      <div class="final-score" id="final-score">0</div>
      <button id="play-again-btn" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div id="bottom-bar">
    <div id="next-area">
      <span id="next-label">Next</span>
      <div id="next-fruit-preview"></div>
    </div>
    <div id="bottom-buttons">
      <button class="bottom-btn" id="guide-btn" onclick="toggleGuide()">
        <img src="https://raw.githubusercontent.com/advme/suika-game/main/info-button.svg" alt="Info">
      </button>
      <button class="bottom-btn" id="restart-btn" onclick="restartGame()">
        <img src="https://raw.githubusercontent.com/advme/suika-game/main/refresh-button.svg" alt="Restart">
      </button>
    </div>
  </div>
</div>

<!-- Fruit Guide Overlay -->
<div id="guide-overlay">
  <div id="guide-backdrop" onclick="toggleGuide()"></div>
  <div id="guide-sheet">
    <div id="guide-handle"></div>
    <div id="guide-sheet-title">Fruit Guide</div>
    <div id="guide-list"></div>
  </div>
</div>

<script>
// ============ VIEWPORT HEIGHT FIX (Safari) ============
function setAppHeight() {
  const vh = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;
  document.documentElement.style.setProperty('--app-height', vh + 'px');
}
setAppHeight();

const ASSET_BASE = 'https://raw.githubusercontent.com/advme/suika-game/main/';

// ============ FRUIT DEFINITIONS ============
const FRUITS = [
  { name: 'Blueberry',   image: ASSET_BASE + 'Frame%202.png',  radius: 18,  color: '#4a9ad4', points: 1  },
  { name: 'Rambutan',    image: ASSET_BASE + 'Frame%203.png',  radius: 24,  color: '#e07090', points: 3  },
  { name: 'Cherry',      image: ASSET_BASE + 'Frame%204.png',  radius: 30,  color: '#cd5c5c', points: 6  },
  { name: 'Persimmon',   image: ASSET_BASE + 'Frame%205.png',  radius: 36,  color: '#e06050', points: 10 },
  { name: 'Melon',       image: ASSET_BASE + 'Frame%206.png',  radius: 44,  color: '#7dab6e', points: 15 },
  { name: 'Coconut',     image: ASSET_BASE + 'Frame%207.png',  radius: 52,  color: '#b07830', points: 21 },
  { name: 'Grape',       image: ASSET_BASE + 'Frame%208.png',  radius: 60,  color: '#9370a8', points: 28 },
  { name: 'Lemon',       image: ASSET_BASE + 'Frame%209.png',  radius: 68,  color: '#e0c050', points: 36 },
  { name: 'Pear',        image: ASSET_BASE + 'Frame%2010.png', radius: 78,  color: '#5a9e8f', points: 45 },
  { name: 'Watermelon',  image: ASSET_BASE + 'Frame%2011.png', radius: 88,  color: '#5a9e5a', points: 55 },
];

// Preload all fruit images
const fruitImages = [];
let imagesLoaded = 0;

// Background image
const bgImage = new Image();
let bgLoaded = false;

function preloadImages(callback) {
  let totalToLoad = FRUITS.length + 1; // +1 for background
  let loaded = 0;

  function checkDone() {
    loaded++;
    if (loaded >= totalToLoad) callback();
  }

  // Load background
  bgImage.onload = () => { bgLoaded = true; checkDone(); };
  bgImage.onerror = () => { checkDone(); };
  bgImage.src = ASSET_BASE + 'background.png';

  // Load fruit images
  for (let i = 0; i < FRUITS.length; i++) {
    const img = new Image();
    img.onload = checkDone;
    img.onerror = () => {
      console.warn('Failed to load:', FRUITS[i].image);
      checkDone();
    };
    img.src = FRUITS[i].image;
    fruitImages[i] = img;
  }
}

let audioCtx = null;
const audioBuffers = {};
let audioInitialized = false;
let audioDecoding = false;

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function initAudio() {
  if (audioInitialized) return;
  audioInitialized = true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // Decode embedded audio data
    decodeAllSounds();
  } catch(e) {
    console.warn('Audio init failed:', e);
  }
}

const NUM_BOPS = 5;

function decodeAllSounds() {
  if (audioDecoding || !audioCtx) return;
  audioDecoding = true;

  // Decode merge sounds (two variations, played alternating)
  ['merge1', 'merge2'].forEach(function(name) {
    try {
      const buf = base64ToArrayBuffer(AUDIO_DATA[name]);
      audioCtx.decodeAudioData(buf,
        function(decoded) { audioBuffers[name] = decoded; console.log('Audio ready:', name); },
        function(e) { console.warn('Audio decode failed:', name, e); }
      );
    } catch(e) { console.warn('Audio decode error:', name, e); }
  });

  // Decode bops MP3 then split into individual sounds
  try {
    const bopsBuf = base64ToArrayBuffer(AUDIO_DATA.bops);
    audioCtx.decodeAudioData(bopsBuf,
      function(decoded) { splitBops(decoded); },
      function(e) { console.warn('Audio decode failed: bops', e); }
    );
  } catch(e) { console.warn('Audio decode error: bops', e); }
}

function splitBops(fullBuffer) {
  const sampleRate = fullBuffer.sampleRate;
  const numChannels = fullBuffer.numberOfChannels;
  const totalSamples = fullBuffer.length;

  // Get channel data for analysis
  const ch0 = fullBuffer.getChannelData(0);
  const ch1 = numChannels > 1 ? fullBuffer.getChannelData(1) : ch0;

  // Compute RMS energy in small windows
  const windowSize = Math.floor(sampleRate * 0.01); // 10ms windows
  const numWindows = Math.floor(totalSamples / windowSize);
  const energy = new Float32Array(numWindows);

  for (let w = 0; w < numWindows; w++) {
    let sum = 0;
    const start = w * windowSize;
    for (let i = 0; i < windowSize; i++) {
      const s = (ch0[start + i] + ch1[start + i]) * 0.5;
      sum += s * s;
    }
    energy[w] = Math.sqrt(sum / windowSize);
  }

  // Adaptive silence threshold
  let maxEnergy = 0;
  for (let w = 0; w < numWindows; w++) {
    if (energy[w] > maxEnergy) maxEnergy = energy[w];
  }
  const silenceThreshold = maxEnergy * 0.02;

  // Find sound regions (non-silent stretches)
  const regions = [];
  let inSound = false;
  let regionStart = 0;
  const minSilenceWindows = Math.floor(0.05 * sampleRate / windowSize); // 50ms silence gap
  let silenceCount = 0;

  for (let w = 0; w < numWindows; w++) {
    if (energy[w] > silenceThreshold) {
      if (!inSound) { regionStart = w; inSound = true; }
      silenceCount = 0;
    } else {
      if (inSound) {
        silenceCount++;
        if (silenceCount >= minSilenceWindows) {
          regions.push({ start: regionStart, end: w - silenceCount });
          inSound = false;
          silenceCount = 0;
        }
      }
    }
  }
  if (inSound) regions.push({ start: regionStart, end: numWindows - 1 });

  console.log('Bop regions found:', regions.length, 'expected:', NUM_BOPS);

  // Take the NUM_BOPS largest regions if we found more
  let finalRegions = regions;
  if (regions.length > NUM_BOPS) {
    finalRegions = regions.slice().sort((a, b) => (b.end - b.start) - (a.end - a.start)).slice(0, NUM_BOPS);
    finalRegions.sort((a, b) => a.start - b.start);
  }

  // Extract each region into its own AudioBuffer
  const bopCount = Math.min(finalRegions.length, NUM_BOPS);
  for (let i = 0; i < bopCount; i++) {
    const r = finalRegions[i];
    const padBefore = Math.floor(sampleRate * 0.005);
    const padAfter = Math.floor(sampleRate * 0.02);
    const startSample = Math.max(0, r.start * windowSize - padBefore);
    const endSample = Math.min(totalSamples, (r.end + 1) * windowSize + padAfter);
    const length = endSample - startSample;

    const bopBuffer = audioCtx.createBuffer(numChannels, length, sampleRate);
    for (let ch = 0; ch < numChannels; ch++) {
      const src = fullBuffer.getChannelData(ch);
      const dst = bopBuffer.getChannelData(ch);
      for (let s = 0; s < length; s++) { dst[s] = src[startSample + s]; }
    }
    audioBuffers['bop' + i] = bopBuffer;
  }

  // Fallback: duplicate if fewer found
  for (let i = bopCount; i < NUM_BOPS; i++) {
    audioBuffers['bop' + i] = audioBuffers['bop' + (i % bopCount)];
  }

  console.log('Bops split: ' + Math.min(bopCount, NUM_BOPS) + ' sounds ready');
}

function playSound(name, volume, pitchShift) {
  if (!audioCtx || !audioBuffers[name]) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffers[name];
    source.playbackRate.value = pitchShift || 1.0;
    const gain = audioCtx.createGain();
    gain.gain.value = volume || 0.5;
    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start(0);
  } catch(e) {
    console.warn('Audio play failed:', name, e);
  }
}

  CANVAS_HEIGHT = h;
  SCALE = w / 400;
  BOX_INSET = Math.round(22 * SCALE);
  BOX_LEFT = BOX_INSET;
  BOX_RIGHT = w - BOX_INSET;
  BOX_TOP = Math.round(110 * SCALE);
  BOX_BOTTOM = h; // flush with bottom bar
  DANGER_Y = BOX_TOP;
  DROP_AREA_Y = Math.round(75 * SCALE);
  FLOOR_Y = BOX_BOTTOM;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function getScaledRadius(level) {
  return FRUITS[level].radius * SCALE;
}

// ============ INIT ============
function init() {
  canvas = document.getElementById('gameCanvas');
  calculateSize();
  preloadImages(startGame);
}

function startGame() {
  engine = Engine.create({
    gravity: { x: 0, y: 1.8 }
  });

  runner = Runner.create();
  setupWalls();

  currentFruitLevel = randomDropLevel();
  nextFruitLevel = randomDropLevel();
  mouseX = (BOX_LEFT + BOX_RIGHT) / 2;

  buildGuide();
  updateNextPreview();
  updateScoreDisplay();

  // Initialize audio on first user interaction (so sounds load before first drop)
  function earlyAudioInit() {
    initAudio();
    canvas.removeEventListener('mousedown', earlyAudioInit);
    canvas.removeEventListener('touchstart', earlyAudioInit);
  }
  canvas.addEventListener('mousedown', earlyAudioInit, { once: true });
  canvas.addEventListener('touchstart', earlyAudioInit, { once: true });

  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('click', onDrop);
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchDrop, { passive: false });

  document.addEventListener('touchmove', e => {
    if (e.target === canvas || e.target.closest('#canvas-container')) {
      e.preventDefault();
    }
  }, { passive: false });

  Events.on(engine, 'collisionStart', onCollision);
  Events.on(engine, 'collisionStart', onImpact);

  Runner.run(runner, engine);
  requestAnimationFrame(gameLoop);
}

function setupWalls() {
  const wallOptions = { isStatic: true, friction: 0.3, restitution: 0.4, render: { visible: false } };
  const boxW = BOX_RIGHT - BOX_LEFT;
  const boxH = BOX_BOTTOM - BOX_TOP;
  const boxCenterX = (BOX_LEFT + BOX_RIGHT) / 2;
  const boxCenterY = (BOX_TOP + BOX_BOTTOM) / 2;
  // Floor at bottom of box
  const floor = Bodies.rectangle(boxCenterX, BOX_BOTTOM + WALL_THICKNESS / 2, boxW + 40, WALL_THICKNESS, wallOptions);
  // Left wall at box left edge
  const leftWall = Bodies.rectangle(BOX_LEFT - WALL_THICKNESS / 2, boxCenterY, WALL_THICKNESS, boxH * 2, wallOptions);
  // Right wall at box right edge
  const rightWall = Bodies.rectangle(BOX_RIGHT + WALL_THICKNESS / 2, boxCenterY, WALL_THICKNESS, boxH * 2, wallOptions);
  World.add(engine.world, [floor, leftWall, rightWall]);
}

function randomDropLevel() {
  const weights = [30, 25, 20, 15, 10];
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return 0;
}

// ============ INPUT HANDLING ============
function onMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
  clampMouseX();
}

function onTouchStart(e) {
  e.preventDefault();
  initAudio(); // ensure audio on touch devices
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  mouseX = (touch.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
  clampMouseX();
}

function onTouchMove(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  mouseX = (touch.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
  clampMouseX();
}

function clampMouseX() {
  const r = getScaledRadius(currentFruitLevel);
  mouseX = Math.max(BOX_LEFT + r + 2, Math.min(BOX_RIGHT - r - 2, mouseX));
}

function onDrop(e) {
  drop();
}

function onTouchDrop(e) {
  e.preventDefault();
  drop();
}

function drop() {
  initAudio(); // ensure audio context on first interaction
  if (!canDrop || gameOver) return;
  const now = Date.now();
  if (now - lastDropTime < DROP_COOLDOWN) return;

  lastDropTime = now;
  canDrop = false;

  const level = currentFruitLevel;
  const x = mouseX;
  const y = DROP_AREA_Y;

  // Play random bop sound with slight pitch variation per fruit size
  const releasePitch = 1.0 + (MAX_DROP_LEVEL - level) * 0.08 + (Math.random() - 0.5) * 0.06;
  const bopIdx = Math.floor(Math.random() * NUM_BOPS);
  playSound('bop' + bopIdx, 0.45, releasePitch);

  const body = createFruitBody(x, y, level);
  World.add(engine.world, body);
  fruitBodies.push({ body, level });

  currentFruitLevel = nextFruitLevel;
  nextFruitLevel = randomDropLevel();
  updateNextPreview();

  setTimeout(() => { canDrop = true; }, DROP_COOLDOWN);
}

function createFruitBody(x, y, level) {
  const r = getScaledRadius(level);
  const body = Bodies.circle(x, y, r, {
    restitution: 0.4,
    friction: 0.5,
    density: 0.001 + level * 0.0003,
    fruitLevel: level,
    label: 'fruit'
  });
  return body;
}

// ============ COLLISION / MERGE ============
function onCollision(event) {
  const pairs = event.pairs;
  for (const pair of pairs) {
    const { bodyA, bodyB } = pair;
    if (bodyA.label !== 'fruit' || bodyB.label !== 'fruit') continue;
    if (bodyA.fruitLevel === undefined || bodyB.fruitLevel === undefined) continue;
    if (bodyA.fruitLevel !== bodyB.fruitLevel) continue;
    if (bodyA.fruitLevel >= FRUITS.length - 1) continue;

    const alreadyQueued = mergeQueue.some(m =>
      m.a === bodyA || m.a === bodyB || m.b === bodyA || m.b === bodyB
    );
    if (alreadyQueued) continue;

    mergeQueue.push({ a: bodyA, b: bodyB, level: bodyA.fruitLevel });
  }
}

function onImpact(event) {
  const now = performance.now();
  for (const pair of event.pairs) {
    const { bodyA, bodyB } = pair;

    const fruits = [];
    if (bodyA.label === 'fruit') fruits.push(bodyA);
    if (bodyB.label === 'fruit') fruits.push(bodyB);
    if (fruits.length === 0) continue;

    for (const fruit of fruits) {
      if (landSquishAnimations.has(fruit.id)) continue;
      if (activePull && (activePull.bodyA === fruit || activePull.bodyB === fruit)) continue;

      const vy = Math.abs(fruit.velocity.y);
      const vx = Math.abs(fruit.velocity.x);
      const speed = Math.sqrt(vx * vx + vy * vy);

      if (speed < 2) continue;

      const intensity = Math.min(speed / 18, 0.35);

      const other = fruit === bodyA ? bodyB : bodyA;
      const dx = fruit.position.x - other.position.x;
      const dy = fruit.position.y - other.position.y;
      const impactAngle = Math.atan2(dy, dx);

      landSquishAnimations.set(fruit.id, {
        startTime: now,
        duration: 250 + intensity * 150,
        intensity,
        angle: impactAngle,
      });
    }
  }
}

function processMerges() {
  const now = performance.now();

  if (mergeQueue.length > 0) {
    for (const merge of mergeQueue) {
      const alreadyPending = pendingMerges.some(m =>
        m.a === merge.a || m.a === merge.b || m.b === merge.a || m.b === merge.b
      );
      if (alreadyPending) continue;
      pendingMerges.push(merge);
    }
    pendingMerges.sort((x, y) => x.level - y.level);
    mergeQueue = [];
  }

  if (activePull) {
    const t = (now - activePull.startTime) / PULL_DURATION;
    if (t >= 1) {
      completeMerge(activePull);
      activePull = null;
    } else {
      const { bodyA, bodyB, startAX, startAY, startBX, startBY, midX, midY } = activePull;
      const aOk = fruitBodies.some(f => f.body === bodyA);
      const bOk = fruitBodies.some(f => f.body === bodyB);
      if (!aOk || !bOk) { activePull = null; return; }
      const ease = t * t * (3 - 2 * t);
      Body.setPosition(bodyA, { x: startAX + (midX - startAX) * ease, y: startAY + (midY - startAY) * ease });
      Body.setPosition(bodyB, { x: startBX + (midX - startBX) * ease, y: startBY + (midY - startBY) * ease });
      Body.setVelocity(bodyA, { x: 0, y: 0 });
      Body.setVelocity(bodyB, { x: 0, y: 0 });
      bodyA.isSensor = true;
      bodyB.isSensor = true;
    }
    return;
  }

  if (pendingMerges.length > 0 && now >= mergeDelay) {
    const merge = pendingMerges.shift();
    const { a, b, level } = merge;

    const aExists = fruitBodies.some(f => f.body === a);
    const bExists = fruitBodies.some(f => f.body === b);
    if (!aExists || !bExists) return;

    activePull = {
      bodyA: a,
      bodyB: b,
      level,
      startTime: now,
      startAX: a.position.x,
      startAY: a.position.y,
      startBX: b.position.x,
      startBY: b.position.y,
      midX: (a.position.x + b.position.x) / 2,
      midY: (a.position.y + b.position.y) / 2,
    };
  }
}

function completeMerge(pull) {
  const now = performance.now();
  const { bodyA, bodyB, level, midX, midY } = pull;

  const aOk = fruitBodies.some(f => f.body === bodyA);
  const bOk = fruitBodies.some(f => f.body === bodyB);
  if (!aOk || !bOk) return;

  const newLevel = level + 1;
  const oldRadius = getScaledRadius(level);

  bodyA.isSensor = false;
  bodyB.isSensor = false;

  World.remove(engine.world, bodyA);
  World.remove(engine.world, bodyB);
  fruitBodies = fruitBodies.filter(f => f.body !== bodyA && f.body !== bodyB);

  spawnMergeEffect(midX, midY, oldRadius, FRUITS[newLevel].color);

  // Play merge sound â€” pitch rises with level for satisfying progression
  const mergePitch = 0.8 + newLevel * 0.1 + (Math.random() - 0.5) * 0.05;
  const mergeVol = Math.min(0.6, 0.35 + newLevel * 0.03);
  mergeCounter++;
  const mergeName = (mergeCounter % 2 === 0) ? 'merge1' : 'merge2';
  playSound(mergeName, mergeVol, mergePitch);

  const newBody = createFruitBody(midX, midY, newLevel);
  World.add(engine.world, newBody);
  fruitBodies.push({ body: newBody, level: newLevel });

  spawnAnimations.set(newBody.id, { startTime: now, duration: 350 });

  const shockRadius = oldRadius * 5;
  const shockStrength = 0.003 + newLevel * 0.001;
  for (const { body: neighbor } of fruitBodies) {
    if (neighbor === newBody) continue;
    const dx = neighbor.position.x - midX;
    const dy = neighbor.position.y - midY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < shockRadius && dist > 1) {
      const falloff = 1 - dist / shockRadius;
      const force = shockStrength * falloff * falloff;
      Body.applyForce(neighbor, neighbor.position, { x: (dx/dist) * force, y: (dy/dist) * force });
      wobbleAnimations.set(neighbor.id, {
        startTime: now,
        duration: 300 + falloff * 150,
        intensity: falloff,
        angle: Math.atan2(dy, dx),
      });
    }
  }

  const pts = FRUITS[newLevel].points;
  score += pts;
  updateScoreDisplay();
  showScorePopup(midX, midY, pts);

  mergeDelay = now + MERGE_STAGGER;
}

// ============ MERGE EFFECTS ============
function spawnMergeEffect(x, y, radius, color) {
  const now = performance.now();

  mergeEffects.push({ type: 'ring', x, y, startRadius: radius * 0.5, endRadius: radius * 2.2, color, startTime: now, duration: 400 });
  mergeEffects.push({ type: 'flash', x, y, radius: radius * 1.3, startTime: now, duration: 200 });

  const count = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const speed = radius * 0.8 + Math.random() * radius * 1.2;
    const size = (4 + Math.random() * 8) * SCALE;
    mergeEffects.push({ type: 'smoke', x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size, startTime: now, duration: 350 + Math.random() * 200, color });
  }

  const sparkleCount = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < sparkleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = radius * 1.5 + Math.random() * radius;
    mergeEffects.push({ type: 'sparkle', x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - radius * 0.5, startTime: now, duration: 300 + Math.random() * 250 });
  }
}

function updateAndDrawEffects() {
  const now = performance.now();
  mergeEffects = mergeEffects.filter(fx => {
    const t = (now - fx.startTime) / fx.duration;
    if (t >= 1) return false;
    ctx.save();

    if (fx.type === 'ring') {
      const ease = 1 - Math.pow(1 - t, 3);
      const r = fx.startRadius + (fx.endRadius - fx.startRadius) * ease;
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.strokeStyle = fx.color;
      ctx.lineWidth = Math.max(1, 3 * (1 - t));
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (fx.type === 'flash') {
      ctx.globalAlpha = (1 - t) * 0.6;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, fx.radius * (0.8 + t * 0.4), 0, Math.PI * 2);
      ctx.fill();
    } else if (fx.type === 'smoke') {
      const ease = 1 - Math.pow(1 - t, 2);
      const px = fx.x + fx.vx * ease;
      const py = fx.y + fx.vy * ease;
      const size = fx.size * (1 - t * 0.5);
      ctx.globalAlpha = (1 - t) * 0.45;
      const grad = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, size));
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.5, fx.color + '88');
      grad.addColorStop(1, fx.color + '00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
    } else if (fx.type === 'sparkle') {
      const ease = 1 - Math.pow(1 - t, 2);
      const px = fx.x + fx.vx * ease;
      const py = fx.y + fx.vy * ease + 20 * SCALE * ease * ease;
      const size = Math.max(1, 2.5 * SCALE * (1 - t));
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    return true;
  });
}

// ============ GAME OVER CHECK ============
function checkGameOver() {
  if (gameOver) return;
  let anyAboveLine = false;
  for (const { body } of fruitBodies) {
    const top = body.position.y - body.circleRadius;
    if (top < DANGER_Y && body.speed < 2) {
      anyAboveLine = true;
      break;
    }
  }
  if (anyAboveLine) {
    if (!dangerTimer) dangerTimer = Date.now();
    else if (Date.now() - dangerTimer > GAME_OVER_GRACE) triggerGameOver();
  } else {
    dangerTimer = null;
  }
}

function triggerGameOver() {
  gameOver = true;
  document.getElementById('final-score').textContent = score;
  document.getElementById('game-over').classList.add('active');
}

function restartGame() {
  World.clear(engine.world);
  Engine.clear(engine);

  fruitBodies = [];
  mergeQueue = [];
  pendingMerges = [];
  mergeDelay = 0;
  activePull = null;
  mergeEffects = [];
  mergeCounter = 0;
  spawnAnimations.clear();
  wobbleAnimations.clear();
  landSquishAnimations.clear();
  score = 0;
  gameOver = false;
  canDrop = true;
  dangerTimer = null;
  lastDropTime = 0;

  calculateSize();
  setupWalls();

  currentFruitLevel = randomDropLevel();
  nextFruitLevel = randomDropLevel();
  mouseX = (BOX_LEFT + BOX_RIGHT) / 2;

  updateNextPreview();
  updateScoreDisplay();
  document.getElementById('game-over').classList.remove('active');
  document.querySelectorAll('.score-popup').forEach(el => el.remove());
}

// ============ RENDERING ============
function gameLoop() {
  processMerges();
  checkGameOver();
  render();
  requestAnimationFrame(gameLoop);
}

function render() {
  const cw = CANVAS_WIDTH;
  const ch = CANVAS_HEIGHT;

  ctx.clearRect(0, 0, cw, ch);

  // Background image (covers full canvas)
  if (bgLoaded && bgImage.complete && bgImage.naturalWidth > 0) {
    const bgAspect = bgImage.naturalWidth / bgImage.naturalHeight;
    const canvasAspect = cw / ch;
    let drawW, drawH, drawX, drawY;
    if (canvasAspect > bgAspect) {
      drawW = cw;
      drawH = cw / bgAspect;
      drawX = 0;
      drawY = (ch - drawH) / 2;
    } else {
      drawH = ch;
      drawW = ch * bgAspect;
      drawX = (cw - drawW) / 2;
      drawY = 0;
    }
    ctx.drawImage(bgImage, drawX, drawY, drawW, drawH);
  } else {
    const grad = ctx.createLinearGradient(0, 0, cw, ch);
    grad.addColorStop(0, '#d4e8f7');
    grad.addColorStop(0.5, '#e0f5f0');
    grad.addColorStop(1, '#d4e8f7');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);
  }

  // ===== 3D BOX CONTAINER =====
  const bL = BOX_LEFT;
  const bR = BOX_RIGHT;
  const bT = BOX_TOP;
  const bB = BOX_BOTTOM;
  const depth = Math.round(18 * SCALE);   // 3D depth of the walls
  const frameW = Math.round(8 * SCALE);   // outer frame thickness
  const cornerR = Math.round(4 * SCALE);

  // Colors
  const frameOuter = '#3a6ba8';     // dark blue outer edge
  const frameMid   = '#5b9eef';     // mid blue
  const frameInner = '#8dc4ff';     // light blue highlight
  const frameShade = '#1a3a5c';     // shadow blue
  const wallFace   = 'rgba(100, 170, 240, 0.18)'; // inner wall face (translucent)
  const wallShine  = 'rgba(255, 255, 255, 0.10)';
  const floorColor = 'rgba(80, 140, 220, 0.12)';

  // --- Outer frame (the thick border) ---
  // Left wall outer frame
  ctx.save();
  const lfGrad = ctx.createLinearGradient(bL - frameW, 0, bL, 0);
  lfGrad.addColorStop(0, frameOuter);
  lfGrad.addColorStop(0.4, frameMid);
  lfGrad.addColorStop(0.85, frameInner);
  lfGrad.addColorStop(1, frameMid);
  ctx.fillStyle = lfGrad;
  ctx.fillRect(bL - frameW, bT - frameW, frameW, bB - bT + frameW * 2);
  ctx.restore();

  // Right wall outer frame
  ctx.save();
  const rfGrad = ctx.createLinearGradient(bR, 0, bR + frameW, 0);
  rfGrad.addColorStop(0, frameMid);
  rfGrad.addColorStop(0.15, frameInner);
  rfGrad.addColorStop(0.6, frameMid);
  rfGrad.addColorStop(1, frameOuter);
  ctx.fillStyle = rfGrad;
  ctx.fillRect(bR, bT - frameW, frameW, bB - bT + frameW * 2);
  ctx.restore();

  // Top edge outer frame
  ctx.save();
  const tfGrad = ctx.createLinearGradient(0, bT - frameW, 0, bT);
  tfGrad.addColorStop(0, frameOuter);
  tfGrad.addColorStop(0.4, frameMid);
  tfGrad.addColorStop(0.85, frameInner);
  tfGrad.addColorStop(1, frameMid);
  ctx.fillStyle = tfGrad;
  ctx.fillRect(bL - frameW, bT - frameW, bR - bL + frameW * 2, frameW);
  ctx.restore();

  // Bottom edge outer frame
  ctx.save();
  const bfGrad = ctx.createLinearGradient(0, bB, 0, bB + frameW);
  bfGrad.addColorStop(0, frameMid);
  bfGrad.addColorStop(0.15, frameInner);
  bfGrad.addColorStop(0.6, frameMid);
  bfGrad.addColorStop(1, frameOuter);
  ctx.fillStyle = bfGrad;
  ctx.fillRect(bL - frameW, bB, bR - bL + frameW * 2, frameW);
  ctx.restore();

  // Frame corner overlaps â€” dark accent
  ctx.fillStyle = frameShade;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(bL - frameW, bT - frameW, frameW, frameW); // top-left
  ctx.fillRect(bR, bT - frameW, frameW, frameW);            // top-right
  ctx.fillRect(bL - frameW, bB, frameW, frameW);             // bottom-left
  ctx.fillRect(bR, bB, frameW, frameW);                      // bottom-right
  ctx.globalAlpha = 1;

  // --- 3D inner depth faces (beveled inward) ---
  // Left wall inner face (trapezoid showing depth)
  ctx.save();
  const lwGrad = ctx.createLinearGradient(bL, 0, bL + depth, 0);
  lwGrad.addColorStop(0, 'rgba(80, 150, 220, 0.25)');
  lwGrad.addColorStop(1, 'rgba(255, 255, 255, 0.03)');
  ctx.fillStyle = lwGrad;
  ctx.beginPath();
  ctx.moveTo(bL, bT);
  ctx.lineTo(bL + depth, bT + depth);
  ctx.lineTo(bL + depth, bB - depth);
  ctx.lineTo(bL, bB);
  ctx.closePath();
  ctx.fill();
  // Highlight edge
  ctx.strokeStyle = wallShine;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bL, bT);
  ctx.lineTo(bL + depth, bT + depth);
  ctx.stroke();
  ctx.restore();

  // Right wall inner face
  ctx.save();
  const rwGrad = ctx.createLinearGradient(bR, 0, bR - depth, 0);
  rwGrad.addColorStop(0, 'rgba(60, 120, 200, 0.2)');
  rwGrad.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
  ctx.fillStyle = rwGrad;
  ctx.beginPath();
  ctx.moveTo(bR, bT);
  ctx.lineTo(bR - depth, bT + depth);
  ctx.lineTo(bR - depth, bB - depth);
  ctx.lineTo(bR, bB);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = wallShine;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bR, bT);
  ctx.lineTo(bR - depth, bT + depth);
  ctx.stroke();
  ctx.restore();

  // Bottom floor inner face (trapezoid showing floor depth)
  ctx.save();
  const flGrad = ctx.createLinearGradient(0, bB, 0, bB - depth);
  flGrad.addColorStop(0, 'rgba(70, 130, 210, 0.22)');
  flGrad.addColorStop(1, 'rgba(255, 255, 255, 0.04)');
  ctx.fillStyle = flGrad;
  ctx.beginPath();
  ctx.moveTo(bL, bB);
  ctx.lineTo(bL + depth, bB - depth);
  ctx.lineTo(bR - depth, bB - depth);
  ctx.lineTo(bR, bB);
  ctx.closePath();
  ctx.fill();
  // Floor top highlight line
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bL + depth, bB - depth);
  ctx.lineTo(bR - depth, bB - depth);
  ctx.stroke();
  ctx.restore();

  // Top edge inner face (shows the rim depth)
  ctx.save();
  const topGrad = ctx.createLinearGradient(0, bT, 0, bT + depth);
  topGrad.addColorStop(0, 'rgba(140, 200, 255, 0.2)');
  topGrad.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
  ctx.fillStyle = topGrad;
  ctx.beginPath();
  ctx.moveTo(bL, bT);
  ctx.lineTo(bL + depth, bT + depth);
  ctx.lineTo(bR - depth, bT + depth);
  ctx.lineTo(bR, bT);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // --- Interior fill (the "glass" inside) ---
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.fillRect(bL + depth, bT + depth, (bR - bL) - depth * 2, (bB - bT) - depth * 2);
  ctx.restore();

  // --- Outer frame edge highlights (top-left shine, bottom-right shadow) ---
  ctx.save();
  // Top outer shine
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bL - frameW, bT - frameW);
  ctx.lineTo(bR + frameW, bT - frameW);
  ctx.stroke();
  // Left outer shine
  ctx.beginPath();
  ctx.moveTo(bL - frameW, bT - frameW);
  ctx.lineTo(bL - frameW, bB + frameW);
  ctx.stroke();
  // Bottom outer shadow
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.beginPath();
  ctx.moveTo(bL - frameW, bB + frameW);
  ctx.lineTo(bR + frameW, bB + frameW);
  ctx.stroke();
  // Right outer shadow
  ctx.beginPath();
  ctx.moveTo(bR + frameW, bT - frameW);
  ctx.lineTo(bR + frameW, bB + frameW);
  ctx.stroke();
  ctx.restore();

  // --- Sparkle / shine accent (bottom-right like in ref) ---
  ctx.save();
  const sparkleX = bR + frameW * 0.4;
  const sparkleY = bB + frameW * 0.4;
  const sp = Math.round(4 * SCALE);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.beginPath();
  ctx.moveTo(sparkleX, sparkleY - sp);
  ctx.lineTo(sparkleX + sp * 0.35, sparkleY);
  ctx.lineTo(sparkleX, sparkleY + sp);
  ctx.lineTo(sparkleX - sp * 0.35, sparkleY);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sparkleX - sp * 0.7, sparkleY);
  ctx.lineTo(sparkleX, sparkleY + sp * 0.35);
  ctx.lineTo(sparkleX + sp * 0.7, sparkleY);
  ctx.lineTo(sparkleX, sparkleY - sp * 0.35);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // ===== ANIMATED DANGER ZONE (top of box) =====
  const dangerTime = performance.now() * 0.001;
  const dangerPulse = 0.5 + 0.5 * Math.sin(dangerTime * 2.5);

  // Danger zone gradient fill inside box (from top of box downward)
  const dzHeight = Math.round(40 * SCALE);
  const dzGrad = ctx.createLinearGradient(0, bT, 0, bT + dzHeight);
  const dangerAlpha = 0.08 + dangerPulse * 0.08;
  dzGrad.addColorStop(0, `rgba(255, 60, 60, ${dangerAlpha})`);
  dzGrad.addColorStop(1, 'rgba(255, 60, 60, 0)');
  ctx.fillStyle = dzGrad;
  ctx.fillRect(bL, bT, bR - bL, dzHeight);

  // Danger line â€” glow
  const lineGlow = 0.3 + dangerPulse * 0.35;
  const lineW = Math.max(1.5, 2 * SCALE);

  ctx.save();
  ctx.shadowColor = `rgba(255, 80, 80, ${lineGlow})`;
  ctx.shadowBlur = 10 * SCALE;
  ctx.strokeStyle = `rgba(255, 90, 90, ${0.35 + dangerPulse * 0.3})`;
  ctx.lineWidth = lineW;
  ctx.beginPath();
  ctx.moveTo(bL, bT);
  ctx.lineTo(bR, bT);
  ctx.stroke();
  ctx.restore();

  // Danger line â€” animated dashes
  const dashLen = Math.max(3, 8 * SCALE);
  ctx.setLineDash([dashLen, dashLen * 0.7]);
  ctx.lineDashOffset = -dangerTime * 30 * SCALE;
  ctx.strokeStyle = `rgba(255, 100, 100, ${0.5 + dangerPulse * 0.3})`;
  ctx.lineWidth = lineW;
  ctx.beginPath();
  ctx.moveTo(bL, bT);
  ctx.lineTo(bR, bT);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineDashOffset = 0;

  // Small warning triangles along danger line
  const triSize = Math.max(4, 5 * SCALE);
  const triSpacing = Math.max(40, 50 * SCALE);
  const triAlpha = 0.15 + dangerPulse * 0.15;
  ctx.fillStyle = `rgba(255, 90, 90, ${triAlpha})`;
  for (let tx = bL + triSpacing / 2; tx < bR; tx += triSpacing) {
    ctx.beginPath();
    ctx.moveTo(tx, bT + 3);
    ctx.lineTo(tx - triSize * 0.6, bT + 3 + triSize);
    ctx.lineTo(tx + triSize * 0.6, bT + 3 + triSize);
    ctx.closePath();
    ctx.fill();
  }

  // Drop guide line (subtle, inside box)
  if (!gameOver) {
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = Math.max(1, SCALE);
    ctx.setLineDash([Math.max(2, 6 * SCALE), Math.max(2, 6 * SCALE)]);
    ctx.beginPath();
    ctx.moveTo(mouseX, bT);
    ctx.lineTo(mouseX, bB);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Current fruit preview (above box, below scoreboard)
  if (!gameOver && canDrop) {
    drawFruit(mouseX, DROP_AREA_Y, currentFruitLevel, 0.6);
  }

  // All fruit bodies
  for (const { body, level } of fruitBodies) {
    drawFruit(body.position.x, body.position.y, level, 1.0, body.angle, body.id);
  }

  // Merge effects on top
  updateAndDrawEffects();
}

function drawFruit(x, y, level, alpha, angle, bodyId) {
  const r = getScaledRadius(level);
  const img = fruitImages[level];

  let scaleX = 1, scaleY = 1;
  let wobbleRotation = 0;
  let pullAlpha = 1;

  // Magnetic pull animation
  if (bodyId && activePull) {
    const t = (performance.now() - activePull.startTime) / PULL_DURATION;
    if (t < 1) {
      const isA = activePull.bodyA.id === bodyId;
      const isB = activePull.bodyB.id === bodyId;
      if (isA || isB) {
        const self = isA ? activePull.bodyA : activePull.bodyB;
        const dx = activePull.midX - self.position.x;
        const dy = activePull.midY - self.position.y;
        const pullAngle = Math.atan2(dy, dx);
        const shrink = 1 - t * 0.5;
        wobbleRotation = pullAngle;
        scaleX = shrink * (1 + t * 0.25);
        scaleY = shrink * (1 - t * 0.15);
        pullAlpha = 1 - t * 0.3;
      }
    }
  }

  if (bodyId && spawnAnimations.has(bodyId)) {
    const anim = spawnAnimations.get(bodyId);
    const t = (performance.now() - anim.startTime) / anim.duration;
    if (t >= 1) {
      spawnAnimations.delete(bodyId);
    } else {
      const elastic = 1 - Math.pow(1 - t, 3) * Math.cos(t * Math.PI * 2.5);
      const s = Math.max(0, elastic);
      if (t < 0.3) { scaleX = s * 1.15; scaleY = s * 0.85; }
      else if (t < 0.6) { scaleX = s * 0.9; scaleY = s * 1.1; }
      else { scaleX = s; scaleY = s; }
    }
  }

  if (bodyId && wobbleAnimations.has(bodyId)) {
    const wb = wobbleAnimations.get(bodyId);
    const t = (performance.now() - wb.startTime) / wb.duration;
    if (t >= 1) {
      wobbleAnimations.delete(bodyId);
    } else {
      const decay = 1 - t;
      const oscillate = Math.sin(t * Math.PI * 4) * decay;
      const amount = wb.intensity * 0.2;
      wobbleRotation = wb.angle;
      scaleX *= 1 + oscillate * amount;
      scaleY *= 1 - oscillate * amount;
    }
  }

  // Landing squish
  let squishAngle = 0;
  if (bodyId && landSquishAnimations.has(bodyId)) {
    const sq = landSquishAnimations.get(bodyId);
    const t = (performance.now() - sq.startTime) / sq.duration;
    if (t >= 1) {
      landSquishAnimations.delete(bodyId);
    } else {
      const decay = Math.pow(1 - t, 1.5);
      const bounce = Math.cos(t * Math.PI * 3) * decay;
      const amt = sq.intensity;
      squishAngle = sq.angle;
      scaleX *= 1 + bounce * amt;
      scaleY *= 1 - bounce * amt * 0.7;
    }
  }

  ctx.save();
  ctx.globalAlpha = alpha * pullAlpha;
  ctx.translate(x, y);
  const totalRotation = wobbleRotation || squishAngle;
  if (totalRotation) ctx.rotate(totalRotation);
  ctx.scale(scaleX, scaleY);
  if (totalRotation) ctx.rotate(-totalRotation);

  // Shadow
  ctx.beginPath();
  ctx.arc(0, Math.max(1, 4 * SCALE), r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fill();

  // Image
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -r, -r, r * 2, r * 2);
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = FRUITS[level].color;
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = Math.max(1, 2 * SCALE);
    ctx.stroke();
  }

  ctx.restore();
}

// ============ UI UPDATES ============
function updateScoreDisplay() {
  const el = document.getElementById('score-display');
  el.textContent = score;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 150);
}

function updateNextPreview() {
  const container = document.getElementById('next-fruit-preview');
  container.innerHTML = '';
  const img = fruitImages[nextFruitLevel];
  if (img && img.complete && img.naturalWidth > 0) {
    const clone = document.createElement('img');
    clone.src = img.src;
    container.appendChild(clone);
  }
}

function buildGuide() {
  const list = document.getElementById('guide-list');
  list.innerHTML = '';
  for (let i = 0; i < FRUITS.length; i++) {
    const f = FRUITS[i];
    const row = document.createElement('div');
    row.className = 'guide-row';

    const icon = document.createElement('div');
    icon.className = 'guide-icon';
    const iconImg = document.createElement('img');
    iconImg.src = f.image;
    icon.appendChild(iconImg);

    const info = document.createElement('div');
    info.className = 'guide-info';
    const name = document.createElement('span');
    name.className = 'guide-name';
    name.textContent = f.name;
    const pts = document.createElement('span');
    pts.className = 'guide-pts';
    pts.textContent = `+${f.points}`;
    info.appendChild(name);
    info.appendChild(pts);

    row.appendChild(icon);
    row.appendChild(info);
    list.appendChild(row);

    if (i < FRUITS.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'guide-arrow';
      arrow.textContent = 'â–¼';
      list.appendChild(arrow);
    }
  }
}

function showScorePopup(x, y, pts) {
  const container = document.getElementById('canvas-container');
  const rect = canvas.getBoundingClientRect();
  const cssX = (x / CANVAS_WIDTH) * rect.width;
  const cssY = (y / CANVAS_HEIGHT) * rect.height;
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.textContent = `+${pts}`;
  popup.style.left = `${cssX}px`;
  popup.style.top = `${cssY}px`;
  container.appendChild(popup);
  setTimeout(() => popup.remove(), 800);
}

function toggleGuide() {
  document.getElementById('guide-overlay').classList.toggle('active');
}

// ============ START ============
// ============ VIEWPORT & RESIZE HANDLING ============
let resizeTimeout = null;
function handleResize() {
  setAppHeight();
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (canvas && ctx) {
      calculateSize();
      if (engine) {
        const bodies = Composite.allBodies(engine.world);
        const statics = bodies.filter(b => b.isStatic);
        World.remove(engine.world, statics);
        setupWalls();
      }
    }
  }, 100);
}

window.addEventListener('load', () => { setAppHeight(); init(); });
window.addEventListener('resize', handleResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleResize);
}
</script>
